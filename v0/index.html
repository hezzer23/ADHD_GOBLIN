<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADHD_GOBLIN — v0</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/parts.css">
</head>
<body>

<!-- strat 0: câmpul organic (WebGL) -->
<canvas id="motes"></canvas>
<!-- strat 1: graful (2D, transparent unde nu e materie) -->
<canvas id="field"></canvas>
<!-- strat 2: zgârietură -->
<div class="grain"></div>

<!-- un singur caption pentru hover (nod sau muchie). Fără status bar,
     fără reticle, fără edgecard — o linie, sus, care explică ce atingi. -->
<div id="caption"><span id="cap-txt"></span></div>

<!-- braindump: teritoriul comun. textul tău rămâne, goblinul răspunde
     sub el, în fontul tău dar în rugină (modul ECOU). -->
<div id="dump">
  <div class="dh"><span>braindump</span><span class="hint">enter = trimite · shift+enter = rând nou</span></div>
  <textarea id="d-input" rows="1" placeholder="scrie haotic. tot. fără filtru." spellcheck="false"></textarea>
  <div class="echo" id="echo"></div>
  <!-- preset-uri: recunoaștere în loc de amintire. Apar doar după o
       întrebare închisă a goblinului. Textul liber rămâne mereu. -->
  <div class="presets" id="presets"></div>
  <button id="dev" type="button" title="dev toolkit pentru testing">dev</button>
</div>

<!-- dev toolkit: instrumente de test, ascunse implicit. Toggle din „dev". -->
<div id="devpanel">
  <div class="dp-h"><span>dev toolkit</span><span id="dp-state">—</span></div>
  <div class="dp-grid">
    <button data-dev="demo" type="button">demo</button>
    <button data-dev="focus" type="button">focus</button>
    <button data-dev="followup" type="button">follow-up</button>
    <button data-dev="exit" type="button">exit</button>
    <button data-dev="gate" type="button">gate</button>
    <button data-dev="commit" type="button">commit 7h</button>
    <button data-dev="state" type="button">state</button>
    <button data-dev="metaball" type="button">blob: on</button>
    <button data-dev="nollm" type="button">llm: on</button>
    <button data-dev="reset" type="button" class="danger">reset</button>
  </div>
</div>

<!-- Stratul 2: butonul „gata" — mic, acid, sub nodul ales. Apare doar
     când triajul a ales un nod. Click → închidere + salvare. -->
<button id="gata" type="button">gata</button>

<script src="vendor/dither.js"></script>
<script src="vendor/noise.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
